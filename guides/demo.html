<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yardplan guides — Reno demo</title><link rel="stylesheet" href="guide.css">
<style>body{margin:16px;background:#fff}.pick{max-width:1100px;margin:0 auto 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:14px system-ui}</style>
<script src="../yardplan/data.js"></script>
<script src="../yardplan-contractor/vendor/jspdf.umd.min.js"></script></head><body>
<div class="pick noprint"><b>Design:</b> <select id="design"><option value="sacramento">Sacramento 95814 sample (default, CA)</option><option value="reno">Reno 89501 sample (alternate)</option><option value="app">Yardplan app saved design (localStorage)</option></select>
 ZIP <input id="zip" value="95814" size="6"> Flow GPM <input id="gpm" placeholder="12" size="4"> Pressure psi <input id="psi" placeholder="60" size="4"> <button id="go">Show guide</button></div>
<div id="guide"></div>
<script type="module">
import { renderGuide } from './guide-ui.js'; import { catalogFromGlobals } from './catalog.js'; import { SAMPLES, DEFAULT_DESIGN } from './sample-design.js';
const catalog = catalogFromGlobals();
function pick() { if (document.getElementById('design').value === 'app') { try { const d = JSON.parse(localStorage.getItem('yardplan.design3d.v2')); if (d) return d; } catch (e) {} alert('No saved app design on this device — showing the Sacramento sample.'); return DEFAULT_DESIGN; } return SAMPLES[document.getElementById('design').value].design; }
document.getElementById('design').onchange = e => { const s = SAMPLES[e.target.value]; if (s) document.getElementById('zip').value = s.zip; };
const qs = new URLSearchParams(location.search); if (qs.get('sample') && SAMPLES[qs.get('sample')]) { document.getElementById('design').value = qs.get('sample'); document.getElementById('zip').value = SAMPLES[qs.get('sample')].zip; }
function go() { const n = id => { const v = document.getElementById(id).value; return v ? +v : undefined; };
  window.guide = renderGuide(document.getElementById('guide'), { design: pick(), zip: document.getElementById('zip').value, catalog, jsPDF: window.jspdf.jsPDF, flowGpm: n('gpm'), pressurePsi: n('psi'), tab: new URLSearchParams(location.search).get('tab') || 'irrigation' });
  document.title = 'Yardplan guide ' + window.guide.irrigation.location.zip; window.guideReady = true; }
document.getElementById('go').onclick = go; go();
if (new URLSearchParams(location.search).has('selftest')) { const pdf = window.guide.pdfDoc(); const buf = pdf.output('arraybuffer'); const ics = window.guide.icsText();
  const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = JSON.stringify({ pdfBytes: buf.byteLength, pdfPages: pdf.getNumberOfPages(), pdfHeader: new TextDecoder().decode(buf.slice(0, 5)), icsEvents: (ics.match(/BEGIN:VEVENT/g) || []).length, zones: window.guide.irrigation.hydrozones.length, tasks: window.guide.maintenance.tasks.length }); document.body.appendChild(pre); }
</script></body></html>
